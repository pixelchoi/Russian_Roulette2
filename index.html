<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCAR-H 전술 룰렛 30Rnd ⚡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>⚡ SCAR-H Tactical Roulette</h1>
        
        <div class="input-section">
            <label>벌칙 항목 입력 (쉼표로 구분):</label>
            <textarea id="penaltyInput" placeholder="콰당 댄스, 멜론차트 1등곡 부르기, 제자리점프 10회, 통과!">콰당 댄스, 멜론차트 1등곡 부르기, 제자리점프 10회</textarea>
        </div>

        <div class="magazine-box">
            <div class="magazine-feed" id="magFeed"></div>
        </div>

        <div class="bullet-counter" id="bulletCounter">MAG: 30 / 30 ROUNDS</div>
        <div class="status-display" id="statusText">조정간 단발. 사격 준비 완료.</div>
        <div class="result-display" id="resultText"></div>

        <div class="control-group">
            <button class="btn" id="shootBtn" onclick="pullTrigger()">단발 사격 (SEMI)</button>
            <button class="btn auto-btn" id="autoBtn" onclick="startFullAuto()">연사 사격 (AUTO)</button>
            <button class="btn reload-btn" id="reloadBtn" onclick="reloadMagazine()">탄창 교체 (RELOAD)</button>
        </div>

        <div class="secret-section">
            <label>🎯 저격 순서 지정 (비밀 입력창):</label>
            <input type="number" id="secretTarget" min="1" max="30" placeholder="예: 7">
            <small>※ 입력된 숫자의 사격 순서에 무조건 벌칙탄이 배치됩니다. (비워두면 100% 랜덤)</small>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
